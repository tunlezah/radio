[package]
name = "dab_radio_backend"
version = "1.0.0"
edition = "2021"
description = "DAB+ Digital Radio Web Application Backend"
license = "MIT"

[dependencies]
# Web framework
actix-web = "4"
actix-ws = "0.3"
actix-cors = "0.7"
actix-files = "0.6"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SDR interface
rtlsdr = "0.1"

# Audio decoding (HE-AAC v2)
symphonia = { version = "0.5", features = ["aac"] }

# mDNS for Chromecast/AirPlay discovery
mdns-sd = "0.11"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Error handling
anyhow = "1"
thiserror = "1"

# UUID for station IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Byte manipulation for DSP
byteorder = "1"
bytes = "1"
num-complex = "0.4"
rustfft = "6"

# HTTP client for casting
reqwest = { version = "0.12", features = ["json"] }

# Base64 for SLS images
base64 = "0.22"

# Crossbeam for lock-free channels
crossbeam-channel = "0.5"

# Parking lot for faster mutexes
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
