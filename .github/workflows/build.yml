name: Build & Release

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-backend:
    name: Build Backend (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: dab_radio_backend
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: dab_radio_backend
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: dab_radio_backend
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: dab_radio_backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation dependencies (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkg-config

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build backend (release)
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin'
        working-directory: backend
        run: cargo test --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp backend/target/${{ matrix.target }}/release/${{ matrix.artifact }} dist/
          chmod +x dist/${{ matrix.artifact }}
          cd dist && tar czf ../dab-radio-backend-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.target }}
          path: dab-radio-backend-${{ matrix.target }}.tar.gz
          retention-days: 30

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package frontend
        run: |
          cd frontend/build
          tar czf ../../dab-radio-frontend.tar.gz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dab-radio-frontend.tar.gz
          retention-days: 30

  package:
    name: Package Release Bundle
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release bundles
        run: |
          for target_dir in artifacts/backend-*; do
            target=$(basename "$target_dir" | sed 's/backend-//')
            echo "Packaging bundle for $target..."

            mkdir -p "bundle-$target"

            # Extract backend binary
            tar xzf "$target_dir/dab-radio-backend-$target.tar.gz" -C "bundle-$target/"

            # Extract frontend
            mkdir -p "bundle-$target/static"
            tar xzf artifacts/frontend/dab-radio-frontend.tar.gz -C "bundle-$target/static/"

            # Include installer
            cp installer/install.sh "bundle-$target/"
            chmod +x "bundle-$target/install.sh"

            # Create final archive
            cd "bundle-$target"
            tar czf "../dab-radio-$target.tar.gz" .
            cd ..
          done

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: dab-radio-*.tar.gz
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dab-radio-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
